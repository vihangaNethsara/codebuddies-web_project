<!-- Main Hangout Template - Modern Design -->
<template name="hangout">
  <div id="post" class="container-fluid hangout-page">
    <button id="show-sidebar" class="btn-show-sidebar" aria-label="Show details sidebar">
      <i class="fas fa-info-circle" aria-hidden="true"></i>
      <span>Show details</span>
    </button>
    
    <div class="row hangout-content-row">
      {{#if Template.subscriptionsReady}}
        {{#with hangout}}
          <!-- Hangout Sidebar - Modern Dark Theme -->
          <aside class="col-md-3 well hangout-sidebar" role="complementary" aria-label="Hangout details">
            <!-- Sidebar Header -->
            <div class="sidebar-header">
              <button id="hide-sidebar" class="btn-close-sidebar" aria-label="Close sidebar">
                <i class="fas fa-times" aria-hidden="true"></i>
              </button>
              
              {{#if isHangoutInProgress start end}} 
                <div class="live-indicator" role="status" aria-live="polite">
                  <span class="live-pulse-dot"></span> 
                  <span class="live-text">LIVE</span>
                </div> 
              {{/if}}
            </div>

            <!-- Hangout Topic -->
            <h2 class="hangout-topic-title {{# if isHangoutCompleted end }}completed{{/if}}" id="hangout-topic">
              {{#if equals visibility false}}
                <span class="badge badge-deleted">
                  <i class="fas fa-trash-alt" aria-hidden="true"></i>
                  DELETED
                </span>
              {{/if}}

              <span class="topic-text">{{topic}}</span>

              {{#if views}} 
                <span class="view-count" data-toggle="tooltip" title="{{views}} views">
                  <i class="fas fa-eye" aria-hidden="true"></i> 
                  <span class="count">{{views}}</span>
                </span> 
              {{/if}}
            </h2>

            <!-- Hangout Group Badge -->
            {{#if group}}
              <div class="group-badge-container">
                <a href="{{pathFor 'study group' studyGroupSlug=group.slug studyGroupId=group.id}}" 
                   class="group-badge">
                  <i class="fas fa-users" aria-hidden="true"></i>
                  <span>{{group.title}}</span>
                </a>
              </div>
            {{/if}}
            
            <!-- Hangout Meta Information -->
            <div class="hangout-meta-info">
              <div class="meta-item type-host">
                <i class="fas {{getHangoutTypeSign type}} meta-icon" aria-hidden="true"></i>
                <span class="meta-text">
                  <strong>{{type}}</strong> hangout 
                  <a id="hangout-faq-popup" class="faq-link" aria-label="Hangout FAQ">
                    <i class="fas fa-question-circle"></i>
                  </a>
                </span>
              </div>
              
              <div class="meta-item host-info">
                <i class="fas fa-user meta-icon" aria-hidden="true"></i>
                <span class="meta-text">
                  Started by 
                  <a href="{{#if currentUser}} {{pathFor 'profile' name=host.name userId=host.id}} {{/if}}" 
                     class="host-link {{#unless currentUser}} continue-popup {{/unless}}">
                    {{host.name}}
                  </a>
                </span>
              </div>
            </div>

            <!-- Hangout Date/Time Card -->
            <div class="date-time-card">
              <div class="card-icon">
                <i class="fas fa-calendar-check" aria-hidden="true"></i>
              </div>
              <div class="card-content">
                <time class="date-display" datetime="{{start}}">
                  {{getHangoutStartDateDay start}}
                </time>
                <div class="time-display">
                  <i class="fas fa-clock" aria-hidden="true"></i>
                  <span>{{getHangoutStartTime start}}</span>
                  <span class="time-separator">-</span>
                  {{#if isHangoutEndTimeTBA start end}}
                    <span class="tba-badge">TBA</span>
                  {{else}}
                    <span>{{getHangoutEndTime end}}</span>
                  {{/if}}
                </div>
              </div>
            </div>
            
            <!-- Hangout Action Buttons -->
            <div class="action-buttons-container">
              {{> hangoutActionButtons }}
            </div>

            <!-- Participants Section -->
            <section class="participants-section">
              <h3 class="section-title">
                <i class="fas fa-users" aria-hidden="true"></i>
                <span>Participants</span>
                <span class="participant-count">{{users.length}}</span>
              </h3>
              <div id="participants" class="participants-grid">
                <a href="{{#if currentUser}} {{pathFor 'profile' name=host.name userId=host.id}} {{/if}}" 
                   class="participant-avatar host-avatar {{#unless currentUser}} continue-popup {{/unless}}"
                   data-toggle="tooltip"
                   title="{{host.name}} (Host)">
                  <img class="img-circle" src="{{host.avatar}}" alt="{{host.name}}">
                  <span class="host-badge"><i class="fas fa-crown"></i></span>
                </a>
                {{#each attendees}}
                  <a href="{{#if currentUser}} {{pathFor 'profile' name=name userId=id}} {{/if}}" 
                     class="participant-avatar {{#unless currentUser}} continue-popup {{/unless}}"
                     data-toggle="tooltip"
                     title="{{name}}">
                    <img class="img-circle" src="{{avatar}}" alt="{{name}}">
                  </a>
                {{/each}}
              </div>
            </section>

            <!-- Hangout Alternatives -->
            {{> hangoutSidebarAlternatives}}

            <!-- Hangout Tips -->
            {{> hangoutSidebarTips}}
          </aside>

          <!-- Hangout Main Content - Modern Design -->
          <main class="col-md-9 hangout-body" role="main">
            <!-- Status Banner -->
            {{# unless isHangoutCompleted end}}
              <div class="status-banner upcoming-banner">
                <i class="fas fa-hourglass-half banner-icon faa-burst animated" aria-hidden="true"></i>
                <span class="banner-text">{{upcomingTime start}}</span>
              </div>
            {{ else }}
              <div class="status-banner ended-banner">
                <i class="fas fa-check-circle banner-icon" aria-hidden="true"></i>
                <span class="banner-text">This hangout has ended.</span>
              </div>
            {{/unless}}

            <!-- Join Hangout Section -->
            <div class="join-section">
              {{#if isAttending users}}
                {{# if externalCheckbox }}
                  <a href="{{externalURL}}" 
                     class="btn btn-join-external" 
                     rel="noopener" 
                     target="_blank"
                     aria-label="Join on {{externalButtonText}}">
                    <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                    <span>Join us on {{externalButtonText}}</span>
                  </a>
                {{ else }}
                  {{> hangoutFrame }}
                {{/if}}
              {{ else }}
                {{# if externalCheckbox }}
                  <a href="{{externalURL}}" 
                     class="btn btn-join-external" 
                     rel="noopener" 
                     target="_blank"
                     aria-label="Join on {{externalButtonText}}">
                    <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                    <span>Join us on {{externalButtonText}}</span>
                  </a>
                {{ else }}
                  <div class="join-placeholder {{#if currentUser}}{{# unless isHangoutCompleted end}} join-hangout {{/unless }} {{else}} continue-popup {{/if}}">
                    <img src="/images/logo-circle-cropped.png" 
                         class="placeholder-logo" 
                         alt="CodeBuddies logo"/>
                    <p class="join-prompt">Click to join hangout</p>
                  </div>
                {{/if}}
              {{/if}}
            </div>

            <!-- Support Organizer Alert -->
            {{> supportHangoutOrganizer organizerId=host.id}}
            
            <!-- Goals Section -->
            <section class="goals-section">
              <header class="section-header">
                <h3 class="section-title">
                  <i class="fas fa-bullseye" aria-hidden="true"></i>
                  <span>Goals of hangout</span>
                </h3>
                {{> hangoutActionBar }}
              </header>
              
              <div id="hangout-description" class="description-content">
                {{{formatDescription this}}}
              </div>
            </section>
            
            <!-- Learnings Section -->
            <section class="learnings-section">
              {{> hangoutLearnings }}
            </section>
            
            <!-- Add Learning Section -->
            <section class="add-learning-section">
              {{> hangoutLearned }}
            </section>
            
            <!-- Comments Section -->
            <section class="comments-section">
              <header class="section-header">
                <h3 class="section-title">
                  <i class="fas fa-comments" aria-hidden="true"></i>
                  <span>Comments</span>
                </h3>
              </header>
              {{> commentBox}}
            </section>
          </main>
        {{else}}
          {{> hangoutNotFound}}
        {{/with}}
      {{else}}
        {{> loading}}
      {{/if}}
    </div>
  </div>
</template>

<!-- Hangout Cards Template - Modern Grid Layout -->
<template name="hangoutCards">
  
  <div class="centered-content-area hangouts-container">

    {{#if liveHangoutsCount }}
      <header class="hangouts-section-header">
        <h3 class="hangouts-title">
          <i class="fas fa-calendar-check" aria-hidden="true"></i>
          <span>{{_ "upcoming_events"}}</span>
        </h3>
        <div class="section-divider"></div>
      </header>
    {{/if}}

    <div id="active_hangouts" class="hangouts-grid" role="feed" aria-label="Upcoming hangouts">
      {{#each hangouts 1}}
        {{#unless isHangoutCompleted end}}
        <div class="card hangout-card-wrapper">
          {{> hangoutCard}}
        </div>
        {{/unless}}
      {{/each}}
    </div>

    {{#if pastHangoutsCount }}
      <header class="hangouts-section-header past-section">
        <h3 class="hangouts-title">
          <i class="fas fa-history" aria-hidden="true"></i>
          <span>{{_ "past_events"}}</span>
        </h3>
        <div class="section-divider"></div>
      </header>
    {{/if}}

    <div id="past_hangouts" class="hangouts-grid" role="feed" aria-label="Past hangouts">
      {{#each hangouts -1}}
        {{#if isHangoutCompleted end}}
         <div class="card hangout-card-wrapper">
           {{> hangoutCard}}
        </div>
        {{/if}}
      {{/each}}
    </div>

    {{#unless status}}
      <div class="load-more-container">
        <button id="loadMore" class="btn btn-load-more" aria-label="Load more hangouts">
          <i class="fas fa-chevron-down" aria-hidden="true"></i>
          <span>Load More</span>
        </button>
      </div>
    {{else}}
      <div class="no-more-hangouts">
        <i class="fas fa-check-circle" aria-hidden="true"></i>
        <h5>There are no more hangouts.</h5>
      </div>
    {{/unless}}

  </div>
  {{#unless Template.subscriptionsReady}}
    {{> loading}}
  {{/unless}}
</template>


<!-- Hangout Card Template - Modern Design -->
<template name="hangoutCard">
  <article 
    class="hangout-card {{#if isHangoutCompleted end }}completed{{/if}}"
    role="article"
    aria-label="Hangout: {{topic}}"
    data-toggle="popover"
    data-placement="top"
    data-content="{{ getDescriptionTruncated description }}"
  >
    <a href="{{pathFor 'hangout' hangoutId=_id }}" class="hangout-card-link">
      <!-- Card Header with Status Badges -->
      <header class="card-header-wrapper">
        <div class="left-section">
          {{#if group}}
            <a class="hangout-title-tag" 
               href="{{pathFor 'study group' studyGroupSlug=group.slug studyGroupId=group.id}}"
               aria-label="Study group: {{group.title}}">
              <i class="fas fa-users" aria-hidden="true"></i>
              <span>{{group.title}}</span>
            </a>
          {{/if}}
        </div>
        <div class="right-section">
          <button class="icon-btn info-icon" 
                  type="button" 
                  aria-label="Show description"
                  data-toggle="popover">
            <i class="fas fa-info-circle"></i>
          </button>
          <span class="hangout-type-icon" aria-label="{{type}} hangout">
            <i class="fas {{getHangoutTypeSign type}}"></i>
          </span>
          {{> hangoutActionBar}}
        </div>
      </header>

      <!-- Live Status Badge -->
      {{#if isHangoutInProgress start end}}
        <div class="live-badge" role="status" aria-live="polite">
          <span class="live-pulse"></span>
          <span class="live-text">LIVE NOW</span>
        </div>
      {{/if}}

      <!-- Card Content -->
      <div class="card-details">
        <h4 class="hangout-topic {{#if isHangoutCompleted end }}completed{{/if}}">
          {{#if isHangoutCompleted end }}
            <i class="fas fa-check-circle completion-icon" aria-hidden="true"></i>
          {{/if}} 
          <span class="topic-text">{{truncate topic}}</span>
        </h4>

        <div class="hangout-metadata">
          <time class="hangout-date {{#if isHangoutCompleted end }}completed{{/if}} {{#if isHangoutInProgress start end }}hide-date{{/if}}"
                datetime="{{start}}">
            <i class="fas fa-calendar-alt" aria-hidden="true"></i>
            <span>{{getHangoutStartDateDay start}}</span>
          </time>
          
          <time class="hangout-time {{#if isHangoutCompleted end }}completed{{/if}} {{#if isHangoutInProgress start end}}hangout-in-progress-time{{/if}}"
                datetime="{{start}}">
            <i class="fas fa-clock" aria-hidden="true"></i>
            {{#if isHangoutInProgress start end}}
              <span>Started at </span>
            {{/if}}
            <span>{{getHangoutStartTime start}}</span>
          </time>
        </div>

        {{# unless isHangoutCompleted end}}
          {{#unless isHangoutInProgress start end}}
            <p class="upcoming-badge">
              {{#if equals visibility false}}
                <i class="fas fa-trash-alt" aria-hidden="true"></i>
                {{_ "deleted"}}
              {{else}}
                <i class="fas fa-hourglass-half" aria-hidden="true"></i>
                {{upcomingTime start}}
              {{/if}}
            </p>
          {{/unless}}
        {{ else }}
          <div class="completed-badge show-on-hover">
            <i class="fas fa-check-circle" aria-hidden="true"></i>
            {{_ "completed"}}
          </div>
        {{/unless}}
      </div>
    </a>

    <!-- RSVP Action Buttons -->
    <footer class="rsvp-buttons">
      {{# unless isHangoutCompleted end}}
        {{#if isHangoutInProgress start end}}
          {{#if isAttending users}}
            <!-- Already joined - no additional button needed -->
          {{else}}
            {{# unless isHangoutCompleted end}}
              <button class="btn btn-action btn-join join-hangout {{#unless currentUser}} continue-popup {{/unless}}"
                      aria-label="Join hangout in session">
                <i class="fas fa-video" aria-hidden="true"></i>
                <span>{{_ "join_in_session"}}</span>
              </button>
            {{/unless}}
          {{/if}}
        {{else}}
          {{#if isAttending users}}
            <button id="leave-hangout" 
                    class="btn btn-action btn-leave"
                    aria-label="Leave hangout">
              <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
              <span>{{_ "leave"}}</span>
            </button>
          {{else}}
            {{# unless isHangoutCompleted end}}
              <button class="btn btn-action btn-rsvp {{#if currentUser}} join-hangout {{else}} continue-popup {{/if}}"
                      aria-label="RSVP to hangout">
                <i class="fas fa-check" aria-hidden="true"></i>
                <span>{{_ "rsvp"}}</span>
              </button>
            {{/unless}}
          {{/if}}
        {{/if}}
      {{/unless}}
    </footer>
  </article>
</template>

<!-- Hangout Item Template -->
<template name="hangoutItem">
  <div class="hangout-item">
    <div class="row">
      <div class="col-md-12">
        <label class="name">
        {{#if isHangoutInProgress start end}}
          &nbsp; &nbsp;<i class="fas fa-dot-circle fa text-danger faa-burst animated"></i> &nbsp;
          <a href="{{pathFor 'hangout' hangoutId=_id }}" class="hangout-topic {{# if isHangoutCompleted end }}completed{{/if}}"> {{topic}} </a>
        {{ else }}
          <a href="{{pathFor 'hangout' hangoutId=_id }}" class="hangout-topic {{# if isHangoutCompleted end }}completed{{/if}}"> {{topic}} </a>
        {{/if}}
        </label>
        {{> hangoutActionBar}}
      </div>

      <div class="col-md-4">
      {{!-- Group Label --}}
      {{#if group}}<p><a href="{{pathFor 'study group' studyGroupSlug=group.slug studyGroupId=group.id}}"> <span class="label label-default pull-right">{{group.title}}</span> </a>  </p>{{/if}}

        {{#if equals visibility false}}
          <span class="label label-pill label-danger">DELETED</span>
        {{else}}
          {{# unless isHangoutCompleted end }}
            {{#if isHangoutInProgress start end}}
              {{#if isAttending users}}
                  <a class="btn btn-cb2 btn-grey btn-success" href="{{pathFor 'hangout' hangoutId=_id }}">{{_ "launch"}}</a>
              {{else}}
                {{# unless isHangoutCompleted end}}
                  <button class="btn btn-cb2 join-hangout {{#unless currentUser}} continue-popup {{/unless}}">{{_ "join_in_session"}}</button>
                {{/unless}}
              {{/if}}
            {{else}}
              {{#if isAttending users}}
                <p class="upcoming">{{upcomingTime start}}</p>
                <a id="leave-hangout" class="btn btn-cb2 btn-leave">{{_ "leave"}}</a>
              {{else}}
                {{# unless isHangoutCompleted end}}
                  <button class="btn btn-cb2 {{#if currentUser}} join-hangout {{else}} continue-popup {{/if}}">{{_ "rsvp"}}</button>
                {{/unless}}
              {{/if}}
            {{/if}}
          {{else}}
            <p class="completed"><i class="fas fa-check" aria-hidden="true"></i> {{_ "completed"}}</p>
          {{/unless}}
        {{/if}}
    </div>

    <div class="col-md-8">
      <p class="status"><label><i class="fas {{getHangoutTypeSign type}}"></i> Started by <a href="{{pathFor 'profile' name=host.name userId=host.id}}" class="{{#unless currentUser}} continue-popup {{/unless}}">{{host.name}}</a></label></p>
      <p class="status"><label><i class="fas fa-calendar-alt fa-lg"></i> {{getHangoutStartDateTime start}} -
        {{#if isHangoutEndTimeTBA start end}}
          To Be Announced
        {{else}}
          {{getHangoutEndDateTime end}}
        {{/if}}
          |
         {{users.length}} Joined  {{#if views}} | <i class="fas fa-eye" aria-hidden="true" data-toggle="tooltip" title="Views" ></i> {{views}} {{/if}}</label> </p>
      <p class="overflowtext">{{ getDescriptionTruncated description }}</p>
    </div>
  </div>
  </div>
</template>

<!-- Hangout Action Buttons Template -->
<template name="hangoutActionButtons">
  <div class="hangout-action-buttons">
    {{# unless isHangoutCompleted end }}
      <a href="{{ googleCalendarUrl this }}" rel="noopener" target="_blank" class="btn btn-block"><i class="fas fa-calendar-alt" aria-hidden="true"></i> {{_ "add_google_calendar"}}</a>
      <a href="{{ icsDownloadLink this }}" download="hangout.ics" class="btn btn-block"><i class="fas fa-calendar-alt" aria-hidden="true"></i>{{_ "add_to_icalendar"}}</a>
    {{/ unless }}

    {{# unless isHangoutCompleted end }}
          {{#if isAttending users}}
            <div id="attendance">
              <a id="leave-hangout" class="btn btn-cb2">{{_ "leave"}}</a>
            </div>
          {{else}}
              {{# unless isHangoutCompleted end}}
                  <button class="btn btn-cb2 {{#if currentUser}} join-hangout {{else}} continue-popup {{/if}}">{{_ "rsvp_long"}}</button>
              {{/unless}}
          {{/if}}
    {{ else }}
      <div class="completed align-center margin-top-1">
        {{#if isAttending users}}
            <p>Thanks for joining! This hangout has ended. Would you like to start another one?</p> <div class="btn btn-cb2 margin-top-1 {{#unless currentUser}} continue-popup  {{else}} create-hangout-popup {{/unless}}"> {{_ "create_a_hangout"}} </div>
        {{else}}
            <p>Sorry, this hangout has ended. Why not start your own?</p>
            <div class="btn btn-cb2 margin-top-1 btn-schedule-hangout {{#unless currentUser}} continue-popup {{else}} create-hangout-popup {{/unless}}">
              {{_ "create_a_hangout"}}
            </div>
        {{/if}}
      </div>
    {{/ unless }}

  <div class="hangout-action-buttons-other">
    <a href="#" class="{{#if currentUser}} clone-hangout {{else}} continue-popup {{/if}} btn btn-cb2"><i class="fas fa-clone" aria-hidden="true"></i> Duplicate</a>
    {{#if hangoutOwner host.id}}
      <a href="#" class="edit-hangout btn btn-cb2">Edit Details</a>
      <a href="#" class="delete-hangout btn btn-cb2"><i class="fas fa-trash-alt" aria-hidden="true"></i> Cancel Hangout</a>
    {{else}}
      {{#if isInRole 'admin,moderator,volunteer' 'CB'}}
          <a href="#" class="edit-hangout btn btn-cb2">Edit Details <span class="label label-info">M</span> </a>
      {{/if}}
      {{#if isInRole 'admin,moderator' 'CB'}}
        <a href="#" class="delete-hangout btn btn-cb2 btn-danger"><i class="fas fa-trash-alt" aria-hidden="true"></i>&nbsp; Delete <span class="label label-info">M</span> </a>
      {{/if}}
    {{/if}}
  </div>

  {{#if isHangoutInProgress start end}}
      {{#if hangoutOwner host.id}}
          <div class="hangout-action-buttons"><div id="end-hangout" class="btn btn-cb2 btn-danger">{{_ "end_hangout"}}</div></div>
      {{else}}
          {{#if isInRole 'admin,moderator,volunteer' 'CB'}}
              <div class="hangout-action-buttons"><div id="end-hangout" class="btn btn-cb2 btn-danger">{{_ 'end_hangout'}}</div></div>
          {{/if}}
      {{/if}}
  {{/if}}
</div>
</template>

<!-- Hangout Action Bar Template -->
<template name="hangoutActionBar">
  <div class="dropdown pull-right icon-spacing">
    <button class="btn btn-default"
            type="button"
            id="dropdownMenu1"
            data-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="true">
      <span>
        <i class="fas fa-ellipsis-v" aria-hidden="true">
        </i>
      </span>
    </button>
    <ul class="dropdown-menu" aria-labelledby="dropdownMenu1">
        {{#unless hangoutOwner host.id}}
          <li class="{{#if currentUser}} report-hangout {{else}} continue-popup {{/if}} ">
            <a href="#">
              Report
            </a>
          </li>
        {{/unless}}
        <li class="{{#if currentUser}} clone-hangout {{else}} continue-popup {{/if}}">
          <a href="#">
            Duplicate
          </a>
        </li>
        {{#if hangoutOwner host.id}}
          <li class="edit-hangout">
            <a href="#">
              Edit Details
            </a>
          </li>
          <li class="delete-hangout">
            <a href="#">
              Delete
            </a>
          </li>
          {{else}}
          {{#if isInRole 'admin,moderator,volunteer' 'CB'}}
            <li role="separator" class="divider"></li>
            <li class="edit-hangout">
              <a href="#">
                Edit
                <span class="label label-info">M</span>
              </a>
            </li>
          {{/if}}
          {{#if isInRole 'admin,moderator' 'CB'}}
            <li role="separator" class="divider"></li>
            <li class="delete-hangout">
              <a href="#">
                Delete
                <span class="label label-info">M</span>
              </a>
            </li>
          {{/if}}
        {{/if}}
    </ul>
  </div>
</template>

<!-- Hangout Frame Template -->
<template name="hangoutFrame">
<div id="hangout-button-wrapper">
  <p class="warning chrome-firefox-warning">Warning: Please load this page using Chrome <img src="/images/chrome.ico" width="25"/> or Firefox <img src="/images/firefox.ico" width="25"/> to avoid technical issues</p>
  <img src="/images/jitsi-screenshot-2018.jpg" width="100%" class="load-hangout load-hangout-screenshot"/>
  <button class="margin-top-1 margin-bottom-1 click-text btn btn-cb2 load-hangout">{{_ "click_to_load_hangout"}}</button>
</div>

<div class="alert alert-info margin-top-1 margin-bottom-1">
  <p class="align-center">If you're seeing a blank screen, <a href="https://meet.jit.si/{{room}}#config.startWithVideoMuted=true" target="_blank" id="joinHere">join here.</a> (New to Jitsi? Check out <a href="/images/codebuddies_jitsi_diagram.jpg" target="_blank">this diagram</a>.)</p>
</div>
  <div id="hangout-container"></div>
  {{#if numParticipants}}
  <div class="margin-top-1 margin-bottom-1">
    <p class="align-center well">{{_ "hangout_participant" count=numParticipants }}</p>
  </div>
  {{/if}}
  <span id="post_id" class="hide">{{_id}}</span>
</template>

<!-- Hangout Learnings Template -->
<template name="hangoutLearnings">
<h3 id="hangout-learnings-title">Things We Learned</h3>
<div class="status-list">
 <div class="learnings">
    {{#each learnings}}
        {{> learningItem}}
    {{/each}}
  {{#if Template.subscriptionsReady}}
    {{#if hasMoreLearnings}}
        <button id="load-more-learnings" class="btn btn-default btn-block">Load more</button>

                <div class="col-md-12">
                  <select class="study-group-single form-control">
                    <option></option>
                  </select>
                </div>
              </div>

              <br>
              <div class="row">
                <div class="col-md-12">
                  <div data-editor-host></div>
                </div>
              </div>
            </div>
            <div id="hangout-options" class="col-md-5 text-left">
              <div class="btn-group btn-group-vertical" data-toggle="buttons">

                </label>
                <label class="btn" id="tId">
                  <input  type="radio" name='hangout-type' value="teaching"><i class="fas fa-circle fa-2x"></i><i class="fas fa-dot-circle fa-2x"></i><span> <i class="fas fa-user text-warning-color type"></i><span class="title">{{_ "teaching_hangout"}}</span></span>
                </label>
                <label class="btn" id="cId">
                  <input  type="radio" name='hangout-type' value="collaboration"><i class="fas fa-circle fa-2x"></i><i class="fas fa-dot-circle fa-2x"></i><span> <i class="fas fa-users text-success-color type"></i><span class="title">{{_ "collaboration_hangout"}}</span></span>
                </label>
              </div>
              <hr />
              <div id="external">
               <label><input type="checkbox" id="external-checkbox" name="externalCheckbox"> Use external platform to host hangout</label>
               <div id="external-fields" style="display: none;">
                   <p><label>Join us on:</label>
                       <input type="text" name="externalButtonText" id="externalButtonText" placeholder="e.g. Zoom, Twitch, etc." class="form-control">
                   </p>
                   <p>
                       <label>URL</label>
                       <input type="text" name="externalURL" id="externalURL" placeholder="Zoom, Twitch, Google Hangout etc. URL" class="form-control">
                   </p>
               </div>
              </div>
              <div class="descriptionHide" id="d1">
                <span>Create a silent hangout to motivate yourself to get through a tutorial with others who are learning from the same tutorial, or create one for a fun silent coworking experience.</span>
              </div>
              <div class="descriptionHide" id="d2">
                <span>Create a teaching hangout to practice teaching a concept or to walk participants through a codebase. This is your chance to share what you know!</span>
              </div>
              <div class="descriptionHide" id="d3">
                <span>Create a collaboration hangout to pair program on a coding exercise, talk through a chapter of a tutorial, or work on an open-sourced project together.</span>
              </div>
            </div>
          </div>
          <br>
          <div class="row">
            <div class="col-md-12 text-center">
              <button id="create-hangout" class="btn btn-cb2">{{_ "create_a_hangout"}}</button>
            </div>
          </div>
          <br>
          <div class="row">
            <div class="col-md-12 text-center">
              <span class="message">{{_ "create_hangout_hint"}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- Hangout Sidebar Alternatives Template -->
<template name="hangoutSidebarAlternatives">
  {{# unless isHangoutCompleted end }}
    {{#if isHangoutInProgress start end}}
      <h3>HANGOUT ALTERNATIVES</h3>
      {{#if isAttending users}}
        <p class="align-center">Want to use Google Hangouts instead?
          {{#unless url }}
            <div class="google-hangout display-inline">
                <div class="g-hangout" data-render="createhangout" data-initial_apps="[{ app_id : '999356798349', start_data: {{_id}}, 'app_type' : 'LOCAL_APP' }]" data-widget_size="72"></div>
            </div>
          {{ else }}
            <a class="btn btn-cb2 btn-grey btn-success google-hangout-button" href="{{url}}" target="_blank">Launch Google Hangout</a>
          {{/unless}}
        </p>
      {{/if}}
    {{/if}}
  {{/unless}}
</template>

<!-- Hangout Sidebar Tips Template -->
<template name="hangoutSidebarTips">
  <h3>Hangout Tips</h3>
  <ol>
    <li>Remember that this is a safe space, and we help each other learn faster. Be patient, and always feel free to ask questions.</li>
    <li>You agree not to stream copyrighted or otherwise objectionable content in the hangout.</li>
    <li class="load-hangout">When it's time, click to load the hangout. </li>
    <li>Please keep video turned off.</li>
    <li>Take advantage of the ability to screenshare simultaneously! It is helpful for reading the same code, pair programming, and staying on task.</li>
    <li>Remember to share what you learned.</li>
  </ol>
</template>

<!-- Support Hangout Organizer Template -->
<template name="supportHangoutOrganizer">
    {{#with supportLinks}}
      <div class="alert alert-warning margin-top-1 margin-bottom-1 alert-dismissible">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        Did you learn a lot in this hangout?
           <br> You can show the hangout organizer your appreciation by:
            <ul>
               {{# if buymeacoffee}}
                   <li><i class="fas fa-arrow-right" aria-hidden="true"></i> <a href="https://www.buymeacoffee.com/{{buymeacoffee}}" target="_blank">buying them a coffee <i class="fas fa-coffee" aria-hidden="true"></i></a></li>
                {{/if}}
                {{# if patreon}}
                    <li><i class="fas fa-arrow-right" aria-hidden="true"></i> <a href="{{patreon}}" target="_blank">supporting them on Patreon <i class="fab fa-patreon"></i></a></li>
                {{/if}}
                {{# if nonprofit}}
                    <li><i class="fas fa-arrow-right" aria-hidden="true"></i> <a href="{{nonprofit}}" target="_blank">supporting a non-profit they champion <i class="fas fa-heart" aria-hidden="true"></i></a></li>
                {{/if}}
            </ul>
        </div>
    {{else}}
      {{#if equals currentUser._id instance.data.organizerId}}
      <div class="alert alert-warning margin-top-1 margin-bottom-1 alert-dismissible">
        <button type="button" class="close" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <p>
           <i class="fas fa-coffee" aria-hidden="true"></i> Please set up your <a href="http://buymeacoffee.com" target="_blank">Buy Me A Coffee</a> or <a href="http://patreon.com" target="_blank">Patreon</a> links so the community can tip you for being a great hangout organizer!
           <a href="#" id='editProfileInfo'>Edit Profile</a>
        </p>
        <p>
          You can also choose to feature a non-profit you'd like to support.
        </p>
      </div>
      {{/if}}
    {{/with}}
</template>
