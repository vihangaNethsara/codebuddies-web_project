<template name="allStudyGroups">
  <div class="study-groups dark-theme">
    {{!-- Hero Section --}}
    <section class="hero-section text-center" role="region" aria-labelledby="study-groups-hero-title">
      <div class="hero-background" aria-hidden="true"></div>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8 col-md-10 text-center">
            <h1 id="study-groups-hero-title" class="hero-title">Grow together — learn with people who ship</h1>
            <p class="hero-subtitle lead mb-4">Find focused study groups, schedule meetups, and build momentum with peers. Join or create a group in minutes.</p>

            <div class="hero-actions d-flex justify-content-center gap-3 mb-4">
              <button type="button" id="createGroupButton" class="btn btn-lg btn-gradient-primary px-4 py-2 {{#unless currentUser}}continue-popup btn-createGroup-notLoggedIn{{/unless}}" aria-label="Start a new study group">
                <i class="fas fa-plus-circle me-2" aria-hidden="true"></i>
                <span>{{_ "start_new_group" }}</span>
              </button>

              <a href="{{pathFor 'study group owners guide'}}" class="btn btn-lg btn-outline-light px-4 py-2" aria-label="Open group owner's guide">
                <i class="fas fa-book me-2" aria-hidden="true"></i>
                <span>Group Owner's Guide</span>
              </a>
            </div>

            <ul class="hero-features list-unstyled d-flex justify-content-center gap-4 flex-wrap small mb-0" aria-hidden="false">
              <li class="d-flex align-items-start gap-2">
                <i class="fas fa-users fa-fw text-primary mt-1" aria-hidden="true"></i>
                <div>
                  <strong>24/7 Rooms</strong>
                  <div class="text-muted small">Always-on spaces for async collaboration</div>
                </div>
              </li>
              <li class="d-flex align-items-start gap-2">
                <i class="fas fa-comments fa-fw text-success mt-1" aria-hidden="true"></i>
                <div>
                  <strong>Active Discussions</strong>
                  <div class="text-muted small">Get help, feedback and resources</div>
                </div>
              </li>
              <li class="d-flex align-items-start gap-2">
                <i class="fas fa-calendar-check fa-fw text-info mt-1" aria-hidden="true"></i>
                <div>
                  <strong>Scheduled Meetups</strong>
                  <div class="text-muted small">Live sessions and study sprints</div>
                </div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </section>
    {{!-- Topbar: compact search + filters (sticky) --}}
    <section class="groups-topbar-section">
      <div class="container">
        <div class="groups-topbar">
            <div class="sg-search position-relative">
            <label for="sg-search-input" class="visually-hidden">Search study groups</label>
            <i class="fas fa-search search-icon" aria-hidden="true"></i>
            <input id="sg-search-input" type="search" class="form-control search-input" placeholder="Search groups, topics, tags..." aria-label="Search study groups" autocomplete="off">
            <button id="sg-search-button" class="btn-search-submit" title="Search">
              <i class="fas fa-search"></i>
              <span>Search</span>
            </button>
            <button id="sg-clear-search" class="btn-clear-search" title="Clear search" style="display:none;">
              <i class="fas fa-times"></i>
            </button>
            <div id="sg-suggestions" class="sg-suggestions list-group position-absolute shadow-sm" style="display:none;" role="listbox" aria-label="Search suggestions"></div>
          </div>

          <div class="sg-actions">
            <div class="view-toggle-wrapper">
              <button class="btn btn-view-toggle {{#if isViewMode 'grid'}}active{{/if}}" data-view="grid" title="Grid view" aria-label="Grid view">
                <i class="fas fa-th"></i>
              </button>
              <button class="btn btn-view-toggle {{#if isViewMode 'list'}}active{{/if}}" data-view="list" title="List view" aria-label="List view">
                <i class="fas fa-list"></i>
              </button>
            </div>

            <div class="filter-controls d-flex align-items-center gap-2">
              <button id="sg-filter-toggle" class="btn btn-outline-light d-inline-flex align-items-center gap-2" aria-expanded="false" aria-controls="advancedFilters">
                <i class="fas fa-filter"></i>
                <span>Filters</span>
              </button>
              <select id="sg-sort" class="form-select form-select-sm" aria-label="Sort by">
                <option value="trending">Trending</option>
                <option value="newest">Newest</option>
                <option value="members">Most Members</option>
              </select>
            </div>

            <div class="chip-list d-none d-sm-flex">
              <button class="chip {{#if isSkillSelected 'beginner'}}active{{/if}}" data-skill="beginner"><span class="icon">⭐</span> Beginner</button>
              <button class="chip {{#if isSkillSelected 'intermediate'}}active{{/if}}" data-skill="intermediate"><span class="icon">⚡</span> Intermediate</button>
              <button class="chip {{#if isSkillSelected 'advanced'}}active{{/if}}" data-skill="advanced"><span class="icon">🚀</span> Advanced</button>
            </div>

            <button id="createGroupButton" class="btn btn-gradient-primary d-flex align-items-center gap-2">
              <i class="fas fa-plus-circle"></i>
              <span>Create Group</span>
            </button>
          </div>
        </div>

        <div id="advancedFilters" class="advanced-filters" role="region" aria-hidden="true">
          <div class="filter-row">
            <div class="filter-col">
              <strong>Categories</strong>
              <div class="chip-row">
                <button class="chip" data-category="all">All Topics</button>
                {{#each categories}}
                  <button class="chip" data-category="{{_id}}">{{name}} <span class="badge bg-light text-dark ms-2">{{groupCount}}</span></button>
                {{/each}}
              </div>
            </div>

            <div class="filter-col">
              <strong>Sort</strong>
              <select class="form-select">
                <option value="trending">Trending</option>
                <option value="newest">Newest</option>
                <option value="members">Most members</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </section>

    {{!-- Stats Section (card-based) --}}
    <section class="stats-section">
      <div class="container">
        {{!-- Featured Groups Carousel --}}
        <div class="featured-section mb-5">
          <div class="section-header d-flex justify-content-between align-items-center mb-3">
            <h3 class="section-title mb-0">
              <i class="fas fa-star me-2 text-warning"></i>
              Featured Groups
            </h3>
            <div class="carousel-controls">
              <button class="btn-carousel-control prev" aria-label="Previous featured groups">
                <i class="fas fa-chevron-left"></i>
              </button>
              <button class="btn-carousel-control next" aria-label="Next featured groups">
                <i class="fas fa-chevron-right"></i>
              </button>
            </div>
          </div>
          <div class="featured-carousel-wrapper">
            <div class="featured-carousel">
              {{#each featuredGroups}}
                <div class="featured-card" role="listitem">
                  <a href="{{pathFor 'study group' studyGroupSlug=slug studyGroupId=_id}}" class="featured-link">
                    <div class="featured-image" style="background-image: url('{{groupImage}}')"></div>
                    <div class="featured-content">
                      <h4 class="featured-title">{{title}}</h4>
                      <p class="featured-meta">
                        <i class="fas fa-users"></i> {{memberCountText}}
                      </p>
                    </div>
                  </a>
                </div>
              {{else}}
                <div class="text-center text-muted py-4">
                  <i class="fas fa-star-half-alt fa-2x mb-2"></i>
                  <p>No featured groups yet</p>
                </div>
              {{/each}}
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stats-card">
            <div class="stat-icon"><i class="fas fa-users-crown fa-2x"></i></div>
            <div class="stat-info">
              <div class="stat-number">{{totalGroups}}{{#unless totalGroups}}12{{/unless}}</div>
              <div class="stat-label">Total Groups</div>
            </div>
          </div>

          <div class="stats-card">
            <div class="stat-icon"><i class="fas fa-bolt fa-2x"></i></div>
            <div class="stat-info">
              <div class="stat-number">{{activeGroups}}{{#unless activeGroups}}5{{/unless}}</div>
              <div class="stat-label">Active Groups</div>
            </div>
          </div>

          <div class="stats-card">
            <div class="stat-icon"><i class="fas fa-user-friends fa-2x"></i></div>
            <div class="stat-info">
              <div class="stat-number">{{totalMembers}}{{#unless totalMembers}}120{{/unless}}</div>
              <div class="stat-label">Members</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    {{!-- Groups Grid Section --}}
    <section class="groups-grid-section">
      <div class="container">
        {{#if isLoading}}
          <div class="loading-state text-center">
            <div class="spinner-border" role="status">
              <i class="fas fa-spinner fa-spin fa-2x"></i>
              <span class="sr-only">Loading...</span>
            </div>
            <p>Loading study groups...</p>
          </div>
        {{else}}
          {{#if sgSearchMode}}
            {{> studyGroupsSearchResult}}
          {{else}}
            {{#if studyGroups.count}}
              <div class="groups-grid">
                {{#each studyGroups}}
                  <div class="group-card hover-lift glass-effect {{#if recommended}}recommended{{/if}}" role="article" tabindex="0" aria-label="Study group: {{title}}">
                    <div class="card-header position-relative">
                      <div class="card-image rounded-top" style="background-image: url({{groupImage}})">
                        <div class="card-overlay gradient-overlay"></div>
                        <span class="activity-badge badge {{activityLevel}}">
                          <i class="fas fa-circle pulse-dot me-1"></i> {{activityStatus}}
                        </span>
                        {{#if isFeatured}}
                          <span class="featured-badge badge-pill">
                            <i class="fas fa-star shine-animation me-1"></i> Featured
                          </span>
                        {{/if}}
                        {{#if recommended}}
                          <span class="recommended-badge badge-pill">
                            <i class="fas fa-thumbs-up me-1"></i> Recommended
                          </span>
                        {{/if}}
                        <div class="skill-level-indicator">
                          <span class="badge" data-skill="{{skillLevel}}">
                            {{#if equals skillLevel 'beginner'}}
                              <i class="fas fa-seedling me-1"></i> Beginner
                            {{else if equals skillLevel 'intermediate'}}
                              <i class="fas fa-tree me-1"></i> Intermediate
                            {{else}}
                              <i class="fas fa-crown me-1"></i> Advanced
                            {{/if}}
                          </span>
                        </div>
                      </div>
                    </div>
                    
                    <div class="card-content">
                      <h3 class="group-title">
                        <a href="{{pathFor 'study group' studyGroupSlug=slug studyGroupId=_id}}">{{title}}</a>
                      </h3>
                      <p class="tagline">{{tagline}}</p>
                      
                      <div class="group-meta">
                        <div class="members-preview">
                          <div class="avatar-stack">
                            {{#each firstFiveMembers}}
                              <img src="{{profileImage}}" alt="{{username}}" class="avatar" title="{{username}}">
                            {{/each}}
                            {{#if hasMoreMembers}}
                              <span class="more-members">+{{remainingMembers}}</span>
                            {{/if}}
                          </div>
                          <span class="meta-text">
                            <i class="fas fa-users fa-fw"></i> {{memberCountText}}
                          </span>
                        </div>
                        
                        <div class="activity-meta">
                            {{#if updatedAt}}
                              <span class="meta-item">
                                <i class="fas fa-clock fa-fw"></i> {{ relativeTime updatedAt }}
                              </span>
                            {{/if}}
                            {{#if numParticipants _id}}
                              <span class="meta-item online-count">
                                <i class="fas fa-laptop fa-fw"></i> {{ numParticipants _id }} online
                              </span>
                            {{/if}}
                        </div>
                      </div>
                      
                      {{#if upcomingEvents}}
                      <div class="upcoming-events">
                        <h4 class="events-title"><i class="fas fa-calendar-alt me-2"></i> Upcoming</h4>
                        {{#each firstTwoEvents}}
                          <div class="event-item">
                            <div class="event-time">
                              <i class="far fa-clock me-1"></i> {{formatDate start}}
                            </div>
                            <div class="event-title">{{title}}</div>
                          </div>
                        {{/each}}
                      </div>
                      {{/if}}
                      
                      {{#if learningPath}}
                      <div class="learning-progress">
                        <div class="progress-header d-flex justify-content-between align-items-center">
                          <span class="progress-title">Learning Path Progress</span>
                          <span class="progress-percentage">{{progressPercentage}}%</span>
                        </div>
                        <div class="progress">
                          <div class="progress-bar" role="progressbar" data-progress="{{progressPercentage}}" aria-valuenow="{{progressPercentage}}" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                      </div>
                      {{/if}}

                      <div class="card-actions d-flex gap-2 mt-3">
                        {{#unless isInRole 'member' _id}}
                          <button class="btn btn-join btn-join-study-group flex-grow-1 {{#unless currentUser}}continue-popup{{else}}join-study-group{{/unless}}" aria-label="Join {{title}}" disabled={{isJoining}}>
                            {{#if isJoining}}
                              <i class="fas fa-spinner fa-spin me-1"></i> Joining...
                            {{else}}
                              <i class="fas fa-user-plus me-1"></i>
                              {{_ "join_study_group"}}
                            {{/if}}
                          </button>
                          <a href="{{pathFor 'study group' studyGroupSlug=slug studyGroupId=_id}}" class="btn btn-outline-light btn-view-details" aria-label="View details for {{title}}">
                            <i class="fas fa-eye"></i>
                          </a>
                        {{/unless}}

                        {{#if isInRole 'admin, moderator, member' _id }}
                          <a href="{{pathFor 'study group' studyGroupSlug=slug studyGroupId=_id}}" class="btn btn-primary flex-grow-1" aria-label="View {{title}}">
                            <i class="fas fa-arrow-right me-1"></i> View Group
                          </a>
                          <button class="btn btn-outline-danger btn-leave-study-group" disabled={{isLeaving}} title="Leave group">
                            {{#if isLeaving}}
                              <i class="fas fa-spinner fa-spin"></i>
                            {{else}}
                              <i class="fas fa-sign-out-alt"></i>
                            {{/if}}
                          </button>
                        {{/if}}
                      </div>
                    </div>
                  </div>
                {{/each}}
              </div>

              {{#unless status}}
                <div class="text-center margin-top-1">
                  <button id="loadMoreStudyGroups" class="btn btn-default btn-load-more" disabled={{loadingMore}}>
                    {{#if loadingMore}}
                      <i class="fas fa-spinner fa-spin"></i> Loading more...
                    {{else}}
                      Load More Groups
                    {{/if}}
                  </button>
                </div>
              {{else}}
                <div class="text-center margin-top-1">
                  <p class="text-muted">No more study groups to display.</p>
                </div>
              {{/unless}}
            {{else}}
              <div class="no-results text-center">
                  <div class="illustration">📭</div>
                  <h3>No groups match your filters</h3>
                  <p class="text-muted">Try adjusting your search or create a new group.</p>
                  <div class="mt-3">
                    <button id="createGroupButtonEmpty" class="btn btn-gradient-primary">Create a group</button>
                  </div>
                </div>
            {{/if}}
          {{/if}}
        {{/if}}
      </div>
    </section>
  </div>
</template>
